<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Municipalidad de Escazú</title>
        <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="background: linear-gradient(135deg, #003366 0%, #005bb5 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center;">
    
    <div class="glass" style="width: 100%; max-width: 450px; padding: 40px; margin: 20px;">
        <div style="text-align: center; margin-bottom: 30px;">
            <i class="fas fa-user-circle" style="font-size: 3rem; color: var(--primary-color);"></i>
            <h2 style="margin-top: 15px;">Acceso al Sistema</h2>
            <p style="color: #666;">Ingrese sus credenciales</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="ejemplo@correo.com" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Su contraseña" required>
            </div>
            <button id="btnSesion" type="click" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Entrar</button>
        </form>

        <div style="text-align: center; margin-top: 20px;">
            <p>¿No tiene cuenta? <a href="register.html" style="color: var(--secondary-color); font-weight: 600;">Regístrese aquí</a></p>
            <a href="index.html" style="display: block; margin-top: 15px; color: #666; text-decoration: none; font-size: 0.9rem;"><i class="fas fa-arrow-left"></i> Volver al inicio</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/login.js" type="module"></script>
</body>
</html>
