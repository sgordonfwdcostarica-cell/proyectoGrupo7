<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Municipalidad de Escazú</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="background: linear-gradient(135deg, #003366 0%, #005bb5 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center;">
    
    <div class="glass" style="width: 100%; max-width: 500px; padding: 40px; margin: 20px;">
        <div style="text-align: center; margin-bottom: 30px;">
            <i class="fas fa-landmark" style="font-size: 3rem; color: var(--primary-color);"></i>
            <h2 style="margin-top: 15px;">Registro Ciudadano</h2>
            <p style="color: #666;">Únase a nuestra plataforma digital</p>
        </div>

        <form id="registerForm">
            <div class="form-group">
                <label for="name">Nombre Completo</label>
                <input type="text" id="name" placeholder="Ingrese su nombre completo" required>
            </div>
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="ejemplo@correo.com" required>
            </div>
            <div class="form-group">
                <label for="phone">Teléfono</label>
                <input type="tel" id="phone" placeholder="8888-8888" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Mínimo 8 caracteres" required minlength="8">
            </div>
            <button type="button" class="btn btn-primary" id="btnRegister" style="width: 100%; margin-top: 10px;">Crear Cuenta</button>
        </form>
        <p id="mensaje-respuesta"></p>

        <div style="text-align: center; margin-top: 20px;">
            <p>¿Ya tiene una cuenta? <a href="login.html" style="color: var(--secondary-color); font-weight: 600;">Inicie Sesión</a></p>
            <a href="index.html" style="display: block; margin-top: 15px; color: #666; text-decoration: none; font-size: 0.9rem;"><i class="fas fa-arrow-left"></i> Volver al inicio</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/register.js" type="module"></script>
</body>
</html>
