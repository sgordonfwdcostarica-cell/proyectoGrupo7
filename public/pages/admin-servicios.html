<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Punto 3 - Gestión de Servicios</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>CRUD 3: Gestión de Servicios Públicos</h1>
            <nav>
                <a href="index.html">Dashboard</a>
            </nav>
        </header>

        <button class="btn btn-nuevo" id="btnCrearNuevo"> + Crear Nuevo Servicio</button>

        <div id="listaServicios">
        </div>
    </div>

    <div class="modal" id="modalServicio">
        <div class="modal-content">
            <h2 id="tituloModal">Nuevo Servicio</h2>
            <form id="formServicio">
                <input type="hidden" id="idServicio">
                <div class="campo">
                    <label>Tipo de Servicio:</label>
                    <input type="text" id="tipo" required>
                </div>
                <div class="campo">
                    <label>Descripción:</label>
                    <textarea id="descripcion" required></textarea>
                </div>
                <div class="campo">
                    <label>Responsable:</label>
                    <input type="text" id="responsable" required>
                </div>
                <div class="campo">
                    <label>Estado:</label>
                    <select id="estado">
                        <option value="Activo">Activo</option>
                        <option value="Mantenimiento">Mantenimiento</option>
                        <option value="Inactivo">Inactivo</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-guardar">Guardar</button>
                <button type="button" class="btn btn-cerrar" id="btnCerrar">Cancelar</button>
            </form>
        </div>
    </div>

    <script type="module" src="../js/admin2.js"></script>

</body>

</html>
